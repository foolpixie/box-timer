<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>BoxTimer</title>
    
    <!-- PWA / iOS Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BoxTimer">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/4843/4843992.png">
    
    <!-- Tailwind and Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.cdnfonts.com/css/digital-7-mono" rel="stylesheet">
    
    <style>
      :root {
        --gym-red: #ff0000;
        --gym-red-glow: rgba(255, 0, 0, 0.7);
        --gym-green: #00ff41;
        --gym-green-glow: rgba(0, 255, 65, 0.7);
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #000;
        color: #fff;
        font-family: 'Inter', sans-serif;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
        height: 100vh;
        width: 100vw;
        position: fixed;
      }
      .digital-font {
        font-family: 'Digital-7 Mono', sans-serif;
      }
      .glow-red {
        color: var(--gym-red);
        text-shadow: 0 0 15px var(--gym-red-glow), 0 0 30px var(--gym-red-glow);
      }
      .glow-green {
        color: var(--gym-green);
        text-shadow: 0 0 15px var(--gym-green-glow), 0 0 30px var(--gym-green-glow);
      }
      .ghost-red { color: var(--gym-red); opacity: 0.05; }
      .ghost-green { color: var(--gym-green); opacity: 0.05; }
      
      @media (orientation: landscape) {
        .hide-header-on-landscape { display: none !important; }
      }
      
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      .picker-gradient-mask {
        mask-image: linear-gradient(to right, transparent, black 35%, black 65%, transparent);
        -webkit-mask-image: linear-gradient(to right, transparent, black 35%, black 65%, transparent);
      }

      .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
      .pt-safe { padding-top: env(safe-area-inset-top); }
    </style>

  }
}
</script>

  <script type="module" src="/index.tsx"></script>
